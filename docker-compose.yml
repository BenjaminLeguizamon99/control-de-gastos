services:
  db:
    image: postgres:17 # Supabase hosted usa PG17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test
    ports: ["5433:5432"] # 5433 para no chocar con un Postgres local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 2s
      retries: 15
